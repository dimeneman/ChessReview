name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linting, Formatting & Code Quality
  # ----------------------------------------------------------------------------
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort flake8

      - name: Run Ruff Linter
        run: ruff check backend tests

      - name: Check Formatting with Black
        run: black --check backend tests

      - name: Verify Import Sorting with isort
        run: isort --check-only backend tests

      - name: Run Flake8
        run: flake8 backend tests

  # ----------------------------------------------------------------------------
  # Job 2: Backend Automated Tests
  # ----------------------------------------------------------------------------
  test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (Stockfish Engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute Pytest Suite with Coverage
        env:
          STOCKFISH_PATH: /usr/games/stockfish
          MPLCONFIGDIR: /tmp/matplotlib
        run: |
          PYTHONPATH=backend pytest tests -v --cov=backend --cov-report=xml --cov-report=term

  # ----------------------------------------------------------------------------
  # Job 3: Frontend Lint & Build
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 4: Container Build & Compose Validation
  # ----------------------------------------------------------------------------
  docker:
    name: Docker Builds & Compose Validation
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose -f infra/docker-compose.yml config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: chessreview-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: chessreview-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

