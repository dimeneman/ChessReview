name: Bug Report
description: Create a report to help us fix a defect or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in **ChessReview**!
  - type: input
    id: environment
    attributes:
      label: Environment & Version
      description: What version or deployment environment are you running?
      placeholder: e.g. Docker Compose, Local Python 3.12, Railway, Vercel
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or sample PGN/FEN to reproduce the behavior.
      placeholder: |
        1. POST /review with PGN '1. e4 e5 ...'
        2. Inspect response moves
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any terminal output, Docker logs, or screenshots here.
      render: shell

